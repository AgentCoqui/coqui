###############################################################################
# Coqui — Dashboard Compose Overlay
#
# Runs the Coqui Dashboard (SPA) via PHP's built-in server.
# Reads the shared SQLite database from the workspace volume.
#
# Usage:
#   docker compose -f compose.yaml -f compose.dashboard.yaml up -d dashboard
#
# Or via Makefile:
#   make docker-dashboard              # start on port 3380
#   make docker-dashboard PORT=3500    # custom port
#   make docker-dashboard-stop         # stop
###############################################################################

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COQUI_UID: ${COQUI_UID:-1000}
        COQUI_GID: ${COQUI_GID:-1000}
    image: coqui:dev
    container_name: coqui-dashboard
    init: true
    command: ["php", "-S", "0.0.0.0:3380", "-t", "public", "public/router.php"]

    # Not interactive
    stdin_open: false
    tty: false

    volumes:
      - .:/app
      - coqui_workspace:/app/.workspace:ro

    ports:
      - "${COQUI_DASHBOARD_PORT:-3380}:3380"

    restart: unless-stopped

    environment:
      COMPOSER_ALLOW_SUPERUSER: 0

    networks:
      - coqui
