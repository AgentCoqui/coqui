###############################################################################
# Coqui — Developer Overlay
#
# Enables Xdebug (step debugging + profiling), mounts sibling path repos
# for Composer symlink resolution, and adds Webgrind for profiler analysis.
#
# Usage:
#   docker compose -f compose.yaml -f compose.dev.yaml run --rm coqui
#
# Start Webgrind in background first:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d webgrind
#
# Or use the Makefile:
#   make dev           # interactive REPL with Xdebug
#   make dev-up        # start Webgrind in background
###############################################################################

services:
  # ===========================================================================
  # Override: Coqui — enable Xdebug + mount workspace root for path repos
  # ===========================================================================
  coqui:
    volumes:
      # Mount the entire workspace parent so Composer path repos resolve
      # identically to the host (../php-agents, ../coqui-brave-search)
      - ..:/workspace

      # Workspace persistence (same named volume as base)
      - coqui_workspace:/workspace/coqui/.workspace

      # Xdebug config — enables the extension (not loaded in base)
      - ./conf.d/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini:ro

      # Shared xdebug profiler output
      - xdebug_data:/tmp/xdebug

    # Override working directory to match workspace mount
    working_dir: /workspace/coqui

    environment:
      # Xdebug configuration
      XDEBUG_MODE: "debug,profile"
      XDEBUG_CONFIG: "client_host=host.docker.internal"
      XDEBUG_TRIGGER: "1"

  # ===========================================================================
  # Dev Tools
  # ===========================================================================

  webgrind:
    image: wodby/webgrind:1
    container_name: coqui_webgrind
    restart: unless-stopped
    ports:
      - "${COQUI_WEBGRIND_PORT:-9002}:8080"
    volumes:
      - xdebug_data:/mnt/xdebug:ro
      - webgrind_storage:/tmp/webgrind
      - .:/mnt/codebase:ro
    environment:
      WEBGRIND_PROFILER_DIR: /mnt/xdebug
      WEBGRIND_MOUNTED_CODEBASE_PATH: /mnt/codebase
    networks:
      - coqui

# =============================================================================
# Additional volumes for dev tools
# =============================================================================
volumes:
  xdebug_data:
    name: coqui_xdebug_data
  webgrind_storage:
    name: coqui_webgrind_storage
