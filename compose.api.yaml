###############################################################################
# Coqui — API Server Compose Overlay
#
# Defines a separate coqui-api service that runs alongside the REPL.
# Uses ReactPHP for a long-running HTTP server process.
#
# Usage:
#   docker compose -f compose.yaml -f compose.api.yaml up -d coqui-api
#   docker compose -f compose.yaml -f compose.api.yaml logs -f coqui-api
#
# Or via Makefile:
#   make docker-api              # start API server (port 3300)
#   make docker-api PORT=3500    # custom port
#   make docker-api-stop         # stop API server
###############################################################################

services:
  coqui-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COQUI_UID: ${COQUI_UID:-1000}
        COQUI_GID: ${COQUI_GID:-1000}
    image: coqui:dev
    container_name: coqui-api
    init: true
    command: ["php", "bin/coqui", "api", "--host", "0.0.0.0", "--port", "3300", "--workspace", "/app/workspace"]

    # API mode: not interactive — run as daemon
    stdin_open: false
    tty: false

    volumes:
      - .:/app
      - coqui_workspace:/app/workspace

    # Expose the API port
    ports:
      - "${COQUI_API_PORT:-3300}:3300"

    # Restart on crash
    restart: unless-stopped

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      COMPOSER_ALLOW_SUPERUSER: 0
      COQUI_API_KEY: ${COQUI_API_KEY:-}
      COQUI_WORKSPACE: ${COQUI_WORKSPACE:-/app/workspace}
      COQUI_AUTO_APPROVE: ${COQUI_AUTO_APPROVE:-false}
      COQUI_UNSAFE: ${COQUI_UNSAFE:-false}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - coqui
