; =============================================================================
; Coqui — Test Configuration
; =============================================================================
; Mounted via compose.test.yaml to enable pcov for code coverage
; and disable OPcache for accurate results.
; =============================================================================

[pcov]
extension = pcov.so
pcov.enabled = 1
pcov.directory = /app/src

[opcache]
; Disable OPcache during testing for accurate coverage
opcache.enable = 0
opcache.enable_cli = 0

[PHP]
; High memory limit for coverage collection
memory_limit = 1G
