; =============================================================================
; Coqui — PHP Configuration
; =============================================================================
; CLI-optimized defaults for a long-running REPL agent.
; Loaded into every container via Dockerfile COPY.
; =============================================================================

[PHP]
; Memory — LLM responses and context windows can be large
memory_limit = 512M

; Execution — CLI is long-running, no time limit
max_execution_time = 0
max_input_time = -1

; Error handling — log to stderr for Docker log collection
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Realpath cache (improves file resolution performance)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Timezone
date.timezone = UTC

; =============================================================================
; OPcache — JIT enabled for CLI performance
; =============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.fast_shutdown = 1

; JIT compilation — tracing mode, optimize hot functions
; 1255 = tracing JIT, optimize hot functions, compile everything
opcache.jit = 1255
opcache.jit_buffer_size = 128M
