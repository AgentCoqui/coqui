; =============================================================================
; Coqui — Xdebug Configuration
; =============================================================================
; Only mounted in development via compose.dev.yaml
; NOT loaded in base compose.yaml — zero overhead unless opted in.
; =============================================================================

[xdebug]
zend_extension = xdebug.so

; Modes: debug (step debugging), profile (cachegrind), trace (function trace)
; Combine with comma: debug,profile
xdebug.mode = debug,profile

; When to activate — "trigger" requires XDEBUG_TRIGGER env var
; Use "yes" to always activate (slower but convenient for dev)
xdebug.start_with_request = trigger

; IDE connection
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false

; Profiler output
xdebug.output_dir = /tmp/xdebug
xdebug.profiler_output_name = cachegrind.out.%t-%R

; Log level (0=none, 1=errors, 3=warnings, 5=info, 7=debug, 10=everything)
xdebug.log_level = 1

; IDE key for session identification
xdebug.idekey = COQUI
