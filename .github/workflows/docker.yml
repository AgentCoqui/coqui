name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-build:
    name: Docker Smoke Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: coqui:smoke
          build-args: |
            COQUI_VERSION=pr-${{ github.sha }}

      - name: Verify bundled PHP extensions
        run: |
          docker run --rm --entrypoint php coqui:smoke -m | grep -E '^(curl|dom|gd|mbstring|pdo_sqlite|readline|xml|zip)$'
          docker run --rm --entrypoint php coqui:smoke -m | grep -E '^(pcntl)$'

      - name: Verify CLI starts
        run: |
          docker run --rm coqui:smoke --version
          set +e
          docker run --rm coqui:smoke doctor --json >/dev/null
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

  build-and-push:
    name: Build & Push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest on main branch pushes
            type=raw,value=latest,enable={{is_default_branch}}
            # semver tags: v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # sha for traceability
            type=sha,prefix=

      - name: Resolve runtime version
        id: runtime-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COQUI_VERSION=${{ steps.runtime-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
